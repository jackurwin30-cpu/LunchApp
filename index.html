<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta name="theme-color" content="#0f172a" />

  <link rel="manifest" href="manifest.json" />

  <title>Randomiser App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: #111827;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .results {
      display: grid;
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 18px;
      transition: transform 0.2s ease;
    }

    .label {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .value {
      font-size: 1.4rem;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🎲 Randomiser</h1>

    <p class="subtitle">
      Fully offline local app
    </p>

    <div class="results">

  <div class="card">
    <div class="label">Carbs</div>
    <div class="value" id="CarbsResult">
      Rice
    </div>
  </div>

  <div class="card">
    <div class="label">Protein</div>
    <div class="value" id="ProteinResult">
      Chicken
    </div>
  </div>

  <div class="card">
    <div class="label">Vegetables</div>
    <div class="value" id="VegetablesResult">
      Broccoli + Spinach
    </div>
  </div>

  <div class="card">
    <div class="label">Style</div>
    <div class="value" id="StyleResult">
      Korean
    </div>
  </div>

</div>

    <button onclick="randomise()">
      Randomise
    </button>

    <div class="footer">
      Runs entirely on your phone
    </div>

  </div>

  <script>

  const Carbs = [
    "Rice",
    "Noodles",
    "Potato",
    "Pasta",
    "Bread",
    "Tacos",
    "Flatbread",
    "Quinoa",
    "Couscous",
    "Sweet Potato"
  ];

  const Protein = [
    "Chicken",
    "Tuna",
    "Eggs",
    "Tofu",
    "Chickpeas",
    "Beef",
    "Lentils",
    "Gyoza",
    "Pork",
    "Salmon"
  ];

  const Vegetables = [
    "Broccoli",
    "Spinach",
    "Tomato",
    "Cucumber",
    "Avocado",
    "Carrot",
    "Corn",
    "Pepper",
    "Onions",
    "Aubergine",
    "Courgette",
    "Kale",
    "Asparagus",
    "Cabbage",
    "Cauliflower",
    "Mushrooms"
  ];

  const Style = [
    "Korean",
    "Peri Peri",
    "Greek",
    "Indian",
    "Italian",
    "Cajun",
    "American",
    "Mexican",
    "Japanese",
    "Turkish",
    "Middle Eastern"
  ];

  function getRandom(arr) {
    return arr[
      Math.floor(Math.random() * arr.length)
    ];
  }

  function getTwoRandom(arr) {

    const shuffled = [...arr].sort(
      () => 0.5 - Math.random()
    );

    return shuffled.slice(0, 2);
  }

  function randomise() {

    document.getElementById(
      "CarbsResult"
    ).textContent = getRandom(Carbs);

    document.getElementById(
      "ProteinResult"
    ).textContent = getRandom(Protein);

    const twoVegetables =
      getTwoRandom(Vegetables);

    document.getElementById(
      "VegetablesResult"
    ).textContent =
      twoVegetables[0] +
      " + " +
      twoVegetables[1];

    document.getElementById(
      "StyleResult"
    ).textContent = getRandom(Style);
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register(
      "service-worker.js"
    );
  }

</script>

</body>
</html>
